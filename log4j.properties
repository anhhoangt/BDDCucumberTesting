# Log4j Configuration for BDD Cucumber API Testing
# This file configures logging output for test execution

# Root logger configuration
# Level options: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
log4j.rootLogger=INFO, console, file

# Console Appender Configuration
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# File Appender Configuration
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/test-execution.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Package-level logging configuration
# Adjust logging levels for specific packages

# REST-assured logging (API request/response details)
log4j.logger.io.restassured=WARN

# Cucumber logging
log4j.logger.io.cucumber=INFO

# Step definitions logging
log4j.logger.StepDefinitions=DEBUG

# HTTP Client logging
log4j.logger.java.net.http=WARN

# Maven Surefire logging
log4j.logger.org.apache.maven=WARN

# Pattern Layout Explanation:
# %d{yyyy-MM-dd HH:mm:ss} - Date and time
# %-5p                     - Log level (INFO, DEBUG, ERROR, etc.) padded to 5 characters
# %c{1}                    - Logger name (class name)
# %L                       - Line number
# %m                       - Log message
# %n                       - New line

# Example log output:
# 2025-12-10 01:30:45 INFO  GitHubApiStepsSimple:98 - Response status: 200
# 2025-12-10 01:30:45 DEBUG GitHubApiStepsSimple:115 - Field 'login': "anhhoangt" ✓
