# Detailed Debug Log Format
# Output: 2025-12-10 01:26:08.123 [main] DEBUG GitHubApiStepsSimple.java:98 - Response status: 200

log4j.rootLogger=DEBUG, console, file

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c.%M:%L - %m%n

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/detailed-debug.log
log4j.appender.file.MaxFileSize=20MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{2}.%M:%L - %m%n

# Show everything
log4j.logger.StepDefinitions=TRACE
log4j.logger.io.cucumber=DEBUG
log4j.logger.io.restassured=DEBUG
